version: '3.8'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "8123:8123"
      - "19000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: tracelens
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: tracelens
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - COLLECTOR_PORT=8080
      - COLLECTOR_GRPC_PORT=50051
      - COLLECTOR_BUFFER_MS=100
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=tracelens
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=tracelens
      - JWT_SECRET=dev-secret-change-in-production
      - JWT_ISSUER=tracelens
      - JWT_AUDIENCE=tracelens-api
      - FEATURE_REPLAY=true
      - FEATURE_COST_ATTRIBUTION=true
      - FEATURE_ANOMALY_DETECTION=true
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "43000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - collector

volumes:
  clickhouse_data:
