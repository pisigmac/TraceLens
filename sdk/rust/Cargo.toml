[package]
name = "tracelens"
version = "1.0.0"
edition = "2021"
authors = ["TraceLens Team"]
description = "TraceLens Rust SDK"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.7", features = ["v4"] }
chrono = "0.4"

[dev-dependencies]
tokio-test = "0.4"
